# Cortex 3 configuration (mounted read-only; container runs with --no-config).
# Secrets come from the environment (HOCON ${?VAR} substitution), see .env.

play.http.secret.key = "change-me-via-CORTEX_SECRET"
play.http.secret.key = ${?CORTEX_SECRET}

# Elasticsearch shared with TheHive (internal network only)
search {
  index = cortex
  uri = "http://soar-elasticsearch:9200"
}

cache.job = 10 minutes

# Analyzers & responders are pulled as Docker images from the catalog below.
job {
  runner = [docker]
  directory = "/tmp/cortex-jobs"
  directory = ${?CORTEX_JOB_DIR}
  dockerDirectory = "/tmp/cortex-jobs"
  dockerDirectory = ${?CORTEX_JOB_DIR}
}

analyzer {
  urls = ["https://catalogs.download.strangebee.com/latest/json/analyzers.json"]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

responder {
  urls = ["https://catalogs.download.strangebee.com/latest/json/responders.json"]
  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

# Session cookie hardening
play.http.session.secure = false   # set true when Cortex is behind HTTPS
play.http.session.httpOnly = true
play.http.parser.maxMemoryBuffer = 1M
play.http.parser.maxDiskBuffer = 1G
